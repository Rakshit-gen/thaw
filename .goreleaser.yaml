# Release builds. Docs: https://goreleaser.com
version: 2

project_name: thaw

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: thaw
    main: ./cmd/thaw
    binary: thaw
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

  # The guest agent runs as PID 1 inside the VM, so it only exists for Linux
  # and must be static.
  - id: thaw-guest
    main: ./cmd/thaw-guest
    binary: thaw-guest
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos: [linux]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - scripts/build-rootfs.sh

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: Rakshit-gen
    name: thaw
  draft: false
  prerelease: auto
  footer: |
    Install:

    ```
    curl -fsSL https://raw.githubusercontent.com/Rakshit-gen/thaw/main/scripts/install.sh | sh
    ```
